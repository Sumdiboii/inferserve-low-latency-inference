name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake git ninja-build
      - name: Configure, build, and test
        run: ./scripts/ci.sh
